driver:
  kind: modern_ebpf

falco:
  rule_matching: all

metrics:
  enabled: true
  outputRule: true

falcosidekick:
  enabled: true
  replicaCount: 1
  webui:
    enabled: true
    replicaCount: 1
  config:
    debug: false
    webhook:
      address: "http://ir-controller.security.svc.cluster.local:8080/webhook"
      minimumpriority: "critical"
      checkcert: false
      method: "POST"
    slack:
      minimumpriority: "warning"
      outputformat: "all"
      messageformat: "Falco Alert: *{{ .Rule }}*"
      footer: "Falco Security"
      icon: "https://raw.githubusercontent.com/falcosecurity/falco/master/doc/falco-white.png"
      username: "Falco"
    webui:
      url: "http://localhost:2802"
      minimumpriority: "warning"

customRules:
  mitre-rules.yaml: |-

    - list: shell_binaries
      items: [bash, sh, zsh]
    
    - list: sensitive_files_lists
      items: [/etc/shadow, /etc/gshadow, /etc/passwd]
    
    - list: system_ns
      items: [kube-system,monitoring, falco, security, cilium-spire, argocd]
    
    - macro: spawned_process
      condition: (evt.type = execve)
    
    # interactive shell

    - rule: T1059.004 Shell Spawned in Container
      desc: Interactive shell spawned inside application container
      condition: >
        (spawned_process
        and in_app_container
        and proc.name in (shell_binaries)
        and proc.tty != 0
        and not proc.pname in (systemd, sshd, init, kubelet))
      output: "MITRE:T1059.004 Shell spawned user=%user.name shell=%proc.name parent=%proc.pname pod=%k8s.pod.name ns=%k8s.ns.name"
      priority: CRITICAL
      tags: [mitre_execution, T1059.004, container]

    # sensitive file read

    - rule: T1003.008 Sensitive File Read in Container
      desc: Sensitive file read inside running container
      condition: >
        (evt.type in (open, openat, openat2)
        and in_app_container
        and fd.name in (sensitive_files_lists)
        and not proc.name in (container_runtimes, useradd, usermod, id, getent)
        and not proc.pname in (container_runtimes))
      output: "MITRE:T1003.008 Credential file read user=%user.name file=%fd.name proc=%proc.name pod=%k8s.pod.name ns=%k8s.ns.name"
      priority: CRITICAL
      tags: [mitre_credential_access, T1003.008, container]

